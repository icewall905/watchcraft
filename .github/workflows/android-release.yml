name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Check tag matches Android version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^versionName=//p' android/version.properties | head -n 1)"
          expected="android-v${version}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match '$expected' from android/version.properties" >&2
            exit 1
          fi
          code="$(sed -n 's/^versionCode=//p' android/version.properties)"
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || { echo 'versionCode must be a positive integer' >&2; exit 1; }
          previous="$(git tag --list 'android-v*' --sort=-version:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')"
          if [[ -n "$previous" ]]; then
            old_code="$(git show "$previous:android/version.properties" | sed -n 's/^versionCode=//p')"
            [[ "$old_code" =~ ^[1-9][0-9]*$ && "$code" -gt "$old_code" ]] || { echo 'Increase versionCode before publishing an update' >&2; exit 1; }
          fi

      - name: Decode production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret' >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/watchcraft-release.jks"
          chmod 600 "$RUNNER_TEMP/watchcraft-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/watchcraft-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/^versionName=//p' android/version.properties | head -n 1)"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/watchcraft-${version}.apk"
          (cd dist && sha256sum "watchcraft-${version}.apk" > SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: watchcraft-android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: watchcraft-android-release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.apk dist/SHA256SUMS --verify-tag --title "WatchCraft ${TAG#android-v}" --generate-notes

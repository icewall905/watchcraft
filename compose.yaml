name: bt

x-bt: &bt
  image: bettertube:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - ${BT_DATA_HOST_DIR:-./data}:/data
    - ${BT_MEDIA_HOST_DIR:-./media}:/media
  # Chromium never runs in these containers: the only browser is the isolated `browser` sidecar below,
  # whose traffic is forced through the public-only `egress` proxy. See docs/SECURITY.md.
  depends_on:
    - pot

services:
  bt-api:
    <<: *bt
    build: .
    container_name: bt-api
    environment:
      BT_SUBTITLE_WORKER: "0"
      BT_BROWSER_URL: http://browser:9300
    networks: [default, browser-ctl]
    ports:
      - "${BT_PORT:-6645}:6645"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6645/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bt-worker:
    <<: *bt
    container_name: bt-worker
    command: ["python", "-m", "bt.agent"]
    stop_grace_period: 20s

  bt-downloader:
    <<: *bt
    container_name: bt-downloader
    command: ["python", "-m", "bt.downloader"]
    stop_grace_period: 30s

  bt-subtitles:
    <<: *bt
    container_name: bt-subtitles
    command: ["python", "-m", "bt.subtitle_jobs"]
    stop_grace_period: 30s
    volumes: !override
      - ${BT_DATA_HOST_DIR:-./data}:/data
      - ${BT_MEDIA_HOST_DIR:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "python", "-m", "bt.subtitle_jobs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Isolated headless Chromium for the board source curator (browser/). No data volume, no secrets,
  # no direct route out: internal networks only, every request through the public-only egress proxy.
  browser:
    build: ./browser
    image: bt-browser:latest
    container_name: bt-browser
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    shm_size: 512m
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EGRESS_PROXY: http://egress:3128
    networks: [browser-ctl, browser-egress]
    depends_on: [egress]

  # Squid forward proxy: ports 80/443 to public addresses only; LAN, loopback, link-local and Docker
  # ranges are refused on the resolved address (browser/egress/squid.conf).
  egress:
    build: ./browser/egress
    image: bt-egress:latest
    container_name: bt-egress
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [browser-egress, browser-out]

  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    container_name: bt-pot
    restart: unless-stopped
    init: true

networks:
  default: {}
  browser-ctl:
    internal: true
  browser-egress:
    internal: true
  browser-out: {}

name: bt

x-bt: &bt
  image: bettertube:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - ${BT_DATA_HOST_DIR:-./data}:/data
    - ${BT_MEDIA_HOST_DIR:-./media}:/media
  # Browser capture is disabled on every host until browser egress can enforce public-only
  # fetching for redirects and subresources. Do not grant SYS_ADMIN or disable security profiles
  # to enable it: filesystem isolation alone does not protect the LAN. See docs/SECURITY.md.
  depends_on:
    - pot

services:
  bt-api:
    <<: *bt
    build: .
    container_name: bt-api
    ports:
      - "${BT_PORT:-6645}:6645"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6645/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bt-worker:
    <<: *bt
    container_name: bt-worker
    command: ["python", "-m", "bt.agent"]
    stop_grace_period: 20s

  bt-downloader:
    <<: *bt
    container_name: bt-downloader
    command: ["python", "-m", "bt.downloader"]
    stop_grace_period: 30s

  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    container_name: bt-pot
    restart: unless-stopped
    init: true

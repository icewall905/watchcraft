# Public-only egress for the headless browser. Squid resolves each destination and checks the
# resolved addresses against blocked_dst before connecting to those same addresses.
http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_dst6 dst ::1 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 2001:db8::/32
acl blocked_names dstdomain .localhost .local .internal .lan .home .arpa .test .invalid

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_names
http_access deny blocked_dst
http_access deny blocked_dst6
http_access deny to_localhost
http_access deny manager
http_access allow all

pinger_enable off
cache deny all
cache_mem 8 MB
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
pid_filename none
coredump_dir /tmp
via off
forwarded_for delete
request_header_max_size 64 KB
reply_body_max_size 25 MB
connect_timeout 15 seconds
read_timeout 30 seconds
shutdown_lifetime 1 seconds

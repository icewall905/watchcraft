<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchCraft extension</title>
<style>
 :root{color-scheme:light dark;--bg:#14121c;--card:#1e1b29;--text:#f2eefc;--muted:#a59fb8;--line:#3a3550;--accent:#ff8fab;--ok:#3ddc97;--bad:#ff929d}
 @media (prefers-color-scheme: light){:root{--bg:#f6f4fb;--card:#fff;--text:#1b1726;--muted:#6b6580;--line:#ddd8ea;--ok:#127a4f;--bad:#b42335}}
 body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}
 main{max-width:34rem;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
 h1{margin:0 0 4px;font-size:1.4rem} p{margin:.4rem 0;color:var(--muted)}
 label{display:grid;gap:6px;margin-top:16px;font-weight:600}
 input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);width:100%;box-sizing:border-box}
 small{color:var(--muted);font-weight:400}
 button{margin-top:18px;font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:0;background:var(--accent);color:#1b1020;cursor:pointer}
 #status{margin-top:14px;min-height:1.5em} .ok{color:var(--ok)} .bad{color:var(--bad)}
 ul{margin:.5rem 0 0;padding-left:1.2rem;color:var(--muted)}
</style>
</head>
<body>
<main>
 <h1>WatchCraft</h1>
 <p>Right-click any image, choose <strong>WatchCraft</strong>, then the mood board to add it to.</p>
 <form id="form">
  <label>WatchCraft address<input id="server" type="url" required placeholder="https://wc.example.org"><small>The address you open WatchCraft at.</small></label>
  <label>Connection key<input id="key" type="password" required placeholder="wcx_…" autocomplete="off"><small>Create one in WatchCraft: Mood Board → Browser extension. It only allows listing your boards, creating boards and adding images.</small></label>
  <button type="submit">Save and connect</button>
 </form>
 <div id="status" role="status"></div>
 <ul id="boards"></ul>
</main>
<script src="options.js"></script>
</body>
</html>

# Parallel install: use a separate .env with dedicated data/media paths.
# docker compose -p watchcraft -f compose.yaml -f compose.watchcraft.yaml up -d --build --wait
services:
  bt-api:
    image: watchcraft:latest
    container_name: wc-api
    environment:
      WC_STT_BASE_URL: ${WC_STT_BASE_URL:-http://10.0.10.73:8011/v1}
      WC_STT_MODEL: ${WC_STT_MODEL:-Qwen/Qwen3-ASR-1.7B}
    ports: !override
      - "${WC_PORT:-6646}:6645"
  bt-worker:
    image: watchcraft:latest
    container_name: wc-worker
  bt-downloader:
    image: watchcraft:latest
    container_name: wc-downloader
  pot:
    container_name: wc-pot
